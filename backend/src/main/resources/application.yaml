server:
  port: 8080

spring:
  application:
    name: mentor
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mentor?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      initializationFailTimeout: 0
      maximumPoolSize: 10
      connectionTimeout: 30000
      validationTimeout: 5000
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:iniData.sql

  jpa:
    hibernate:
      ddl-auto: update
  web:
    resources:
      static-locations: classpath:/static/,file:./upload/

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


wechat:
  # 支持通过环境变量覆盖，避免被空环境变量覆盖时取空
  appid: ${WECHAT_APPID:wx4e9ac0fa4f3c2244}
  secret: ${WECHAT_SECRET:77d2a66e0fdd3d6a50298a1c4931a2f9}
  insecure: ${WECHAT_SSL_INSECURE:false}

auth:
  tokenTtlDays: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
